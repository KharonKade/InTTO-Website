<!DOCTYPE html>
<html>
<head>
    <title>Direct Cloudinary Test</title>
    <style>
        body { font-family: monospace; padding: 40px; background: #1e1e1e; color: #4ec9b0; }
        button { padding: 20px; font-size: 18px; cursor: pointer; margin: 10px; }
        #result { white-space: pre-wrap; background: #252526; padding: 20px; margin: 20px 0; }
        .error { color: #f48771; }
        .success { color: #4ec9b0; }
    </style>
</head>
<body>
    <h1>🔬 Direct Cloudinary API Test</h1>
    <p>Testing without any framework - just pure fetch</p>
    
    <button onclick="testUpload()">Test Upload Now</button>
    
    <div id="result"></div>

    <script>
        const result = document.getElementById('result');
        
        async function testUpload() {
            result.innerHTML = 'Testing...\n\n';
            
            // Create tiny test image
            const canvas = document.createElement('canvas');
            canvas.width = 1;
            canvas.height = 1;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = 'red';
            ctx.fillRect(0, 0, 1, 1);
            
            canvas.toBlob(async (blob) => {
                const file = new File([blob], 'test.png', { type: 'image/png' });
                
                const formData = new FormData();
                formData.append('file', file);
                formData.append('upload_preset', 'ucolab_project');
                
                result.innerHTML += '📤 Sending request...\n';
                result.innerHTML += `URL: https://api.cloudinary.com/v1_1/dy9tkp58u/image/upload\n`;
                result.innerHTML += `Preset: ucolab_project\n`;
                result.innerHTML += `File: test.png (${blob.size} bytes)\n\n`;
                
                try {
                    const response = await fetch('https://api.cloudinary.com/v1_1/dy9tkp58u/image/upload', {
                        method: 'POST',
                        body: formData
                    });
                    
                    const text = await response.text();
                    
                    result.innerHTML += `📥 Status: ${response.status} ${response.statusText}\n\n`;
                    
                    if (response.ok) {
                        const data = JSON.parse(text);
                        result.innerHTML += '✅ SUCCESS!\n\n';
                        result.innerHTML += `Image URL: ${data.secure_url}\n`;
                        result.innerHTML += `Public ID: ${data.public_id}\n`;
                        result.innerHTML += `Format: ${data.format}\n`;
                        result.innerHTML += `\n✅ YOUR PRESET WORKS! Update your code now.`;
                        result.className = 'success';
                    } else {
                        try {
                            const error = JSON.parse(text);
                            result.innerHTML += '❌ FAILED\n\n';
                            result.innerHTML += `Error: ${JSON.stringify(error, null, 2)}\n\n`;
                            
                            if (response.status === 401) {
                                result.innerHTML += '🔍 This 401 error means:\n';
                                result.innerHTML += '1. The preset "ucolab_project" doesn\'t exist, OR\n';
                                result.innerHTML += '2. It exists but is set to "Signed" instead of "Unsigned"\n\n';
                                result.innerHTML += '🔧 Fix:\n';
                                result.innerHTML += '- Go to Cloudinary > Settings > Upload > Upload Presets\n';
                                result.innerHTML += '- Find "ucolab_project"\n';
                                result.innerHTML += '- Click on it to edit\n';
                                result.innerHTML += '- Change "Signing Mode" dropdown to "Unsigned"\n';
                                result.innerHTML += '- Click Save\n';
                                result.innerHTML += '- Wait 30 seconds and try again\n';
                            }
                        } catch (e) {
                            result.innerHTML += text;
                        }
                        result.className = 'error';
                    }
                } catch (error) {
                    result.innerHTML += `❌ Network Error: ${error.message}`;
                    result.className = 'error';
                }
            }, 'image/png');
        }
    </script>
</body>
</html>
