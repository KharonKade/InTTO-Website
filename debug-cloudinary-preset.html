<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cloudinary Preset Debugger</title>
    <style>
        body {
            font-family: monospace;
            padding: 40px;
            background: #1e1e1e;
            color: #d4d4d4;
        }
        .test-box {
            background: #252526;
            border: 1px solid #3e3e42;
            border-radius: 8px;
            padding: 20px;
            margin: 20px 0;
        }
        button {
            background: #0e639c;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            margin: 10px 5px;
        }
        button:hover {
            background: #1177bb;
        }
        .success { color: #4ec9b0; }
        .error { color: #f48771; }
        .warning { color: #dcdcaa; }
        .log {
            background: #1e1e1e;
            border: 1px solid #3e3e42;
            padding: 15px;
            margin: 10px 0;
            border-radius: 4px;
            max-height: 400px;
            overflow-y: auto;
        }
        input {
            background: #3c3c3c;
            border: 1px solid #3e3e42;
            color: #d4d4d4;
            padding: 8px 12px;
            border-radius: 4px;
            width: 300px;
            font-family: monospace;
        }
    </style>
</head>
<body>
    <h1>🔍 Cloudinary Preset Debugger</h1>
    
    <div class="test-box">
        <h3>Test Different Preset Names</h3>
        <p>Try various preset names to find the correct one:</p>
        
        <div style="margin: 20px 0;">
            <input type="text" id="presetName" value="ucolab_project" placeholder="Preset name">
            <button onclick="testPreset()">Test This Preset</button>
        </div>
        
        <div style="margin: 20px 0;">
            <p><strong>Common variations to try:</strong></p>
            <button onclick="testPresetName('ucolab_project')">ucolab_project</button>
            <button onclick="testPresetName('ucolab_projects')">ucolab_projects</button>
            <button onclick="testPresetName('ucolab-project')">ucolab-project</button>
            <button onclick="testPresetName('ucola b_project')">ucolаb_project (with space)</button>
            <button onclick="testPresetName('ucolab_Project')">ucolab_Project</button>
        </div>
    </div>

    <div class="test-box">
        <h3>Upload Log:</h3>
        <div id="log" class="log"></div>
    </div>

    <script>
        const CLOUD_NAME = 'dy9tykp58u';
        const logDiv = document.getElementById('log');

        function log(message, type = 'info') {
            const color = type === 'success' ? '#4ec9b0' : 
                         type === 'error' ? '#f48771' : 
                         type === 'warning' ? '#dcdcaa' : '#d4d4d4';
            logDiv.innerHTML += `<div style="color: ${color}">${new Date().toLocaleTimeString()} - ${message}</div>`;
            logDiv.scrollTop = logDiv.scrollHeight;
        }

        async function testPresetName(presetName) {
            document.getElementById('presetName').value = presetName;
            await testPreset();
        }

        async function testPreset() {
            const presetName = document.getElementById('presetName').value.trim();
            
            log(`\n========================================`, 'info');
            log(`Testing preset: "${presetName}"`, 'warning');
            log(`Cloud: ${CLOUD_NAME}`, 'info');
            
            // Create tiny test image
            const canvas = document.createElement('canvas');
            canvas.width = 1;
            canvas.height = 1;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = 'red';
            ctx.fillRect(0, 0, 1, 1);
            
            canvas.toBlob(async (blob) => {
                const testFile = new File([blob], 'test.png', { type: 'image/png' });
                
                const formData = new FormData();
                formData.append('file', testFile);
                formData.append('upload_preset', presetName);
                
                const url = `https://api.cloudinary.com/v1_1/${CLOUD_NAME}/image/upload`;
                
                try {
                    log(`Sending request to: ${url}`, 'info');
                    log(`Preset parameter: "${presetName}"`, 'info');
                    
                    const response = await fetch(url, {
                        method: 'POST',
                        body: formData
                    });
                    
                    const responseText = await response.text();
                    log(`Response status: ${response.status} ${response.statusText}`, 
                        response.ok ? 'success' : 'error');
                    
                    if (response.ok) {
                        const data = JSON.parse(responseText);
                        log(`✅ SUCCESS! Preset "${presetName}" works!`, 'success');
                        log(`Image URL: ${data.secure_url}`, 'success');
                        log(`Public ID: ${data.public_id}`, 'success');
                        log(`\n🎉 UPDATE YOUR CODE WITH THIS PRESET NAME: "${presetName}"`, 'success');
                    } else {
                        let errorData;
                        try {
                            errorData = JSON.parse(responseText);
                        } catch (e) {
                            errorData = { message: responseText };
                        }
                        
                        log(`❌ FAILED with preset "${presetName}"`, 'error');
                        log(`Error: ${JSON.stringify(errorData, null, 2)}`, 'error');
                        
                        if (response.status === 401) {
                            log(`This means: Preset doesn't exist OR it's not set to "Unsigned"`, 'warning');
                        }
                    }
                    
                } catch (error) {
                    log(`❌ Network error: ${error.message}`, 'error');
                }
                
                log(`========================================\n`, 'info');
            }, 'image/png');
        }

        // Auto-test on load
        log('🔍 Cloudinary Preset Debugger Ready', 'success');
        log('Click buttons above to test different preset names', 'info');
        log('Or type your own and click "Test This Preset"', 'info');
    </script>
</body>
</html>
