<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Startups Management - UC InTTO Admin</title>
    <link rel="stylesheet" href="css/dashboard-style.css"> 
    <link rel="stylesheet" href="css/startups-style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>

    <aside class="sidebar">
        <div class="sidebar-header">
            <h3>UC InTTO</h3>
            <p>Admin Portal</p>
        </div>
        <nav class="sidebar-nav">
            <ul>
                <li><a href="dashboard.html"><i class="fa-solid fa-table-columns"></i> Dashboard</a></li>
                <li><a href="startups.html" class="active"><i class="fa-solid fa-rocket"></i> Startups</a></li>
                <li><a href="ip-applications.html"><i class="fa-solid fa-file-shield"></i> IP Applications</a></li>
                <li><a href="metrics.html"><i class="fa-solid fa-chart-line"></i> Metrics</a></li>
                <li><a href="news-events.html"><i class="fa-solid fa-newspaper"></i> News & Events</a></li>
                <li><a href="team.html"><i class="fa-solid fa-users"></i> Team</a></li>
                <li><a href="sdg.html"><i class="fa-solid fa-bullseye"></i> SDG</a></li>
            </ul>
        </nav>
    </aside>

    <main class="main-content">
        <header class="main-header">
            <a href="/ucolab/index.html" class="logout-btn"><i class="fa-solid fa-right-from-bracket"></i> Logout</a>
        </header>

        <section class="page-content">
            <div class="page-header">
                <div>
                    <h1>Startups Management</h1>
                    <p class="subtitle">Manage incubated startups and their information</p>
                </div>
                <button class="btn btn-primary" id="add-startup-btn"><i class="fa-solid fa-plus"></i> Add Startup</button>
            </div>

            <div class="filters-container">
                <div class="search-wrapper">
                    <i class="fa-solid fa-search"></i>
                    <input type="text" id="search-input" placeholder="Search startups...">
                </div>
                <div class="category-filters">
                    <button class="filter-btn active" data-filter="all">All</button>
                    <button class="filter-btn" data-filter="AI and Data Science">AI & Data</button>
                    <button class="filter-btn" data-filter="SaaS and Enterprise Solutions">SaaS</button>
                    <button class="filter-btn" data-filter="Fintech">Fintech</button>
                    <button class="filter-btn" data-filter="E-commerce">E-commerce</button>
                    <button class="filter-btn" data-filter="Health">Health</button>
                    <button class="filter-btn" data-filter="Agriculture and Food">Agri & Food</button>
                    <button class="filter-btn" data-filter="Education Technologies">EdTech</button>
                    <button class="filter-btn" data-filter="Creative Industries">Creative</button>
                    <button class="filter-btn" data-filter="Criminology, Forensics, and Public Safety">Criminology</button>
                    <button class="filter-btn" data-filter="Sustainability and Cleantech">Sustainability</button>
                    <button class="filter-btn" data-filter="Smart Cities and Mobility">Smart Cities</button>
                </div>
            </div>

            <div class="sort-container">
                <label for="sort-startups">Sort by:</label>
                <select id="sort-startups" class="sort-dropdown">
                    <option value="recent">Recent</option>
                    <option value="oldest">Oldest</option>
                    <option value="a-z">Name (A-Z)</option>
                    <option value="z-a">Name (Z-A)</option>
                </select>
            </div>
            
            <div class="startup-list">
                <!-- Cards injected by JS -->
            </div>

        </section>
    </main>

    <!-- No modal needed anymore, using external pages -->
    
    <script src="js/startups.js"></script>
</body>
</html>
