<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>News & Events - UC InTTO Admin</title>
    <link rel="stylesheet" href="css/dashboard-style.css">
    <link rel="stylesheet" href="css/news-events-style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>

    <aside class="sidebar">
        <div class="sidebar-header">
            <h3>UC InTTO</h3>
            <p>Admin Portal</p>
        </div>
        <nav class="sidebar-nav">
            <ul>
                <li><a href="dashboard.html"><i class="fa-solid fa-table-columns"></i> Dashboard</a></li>
                <li><a href="startups.html"><i class="fa-solid fa-rocket"></i> Startups</a></li>
                <li><a href="ip-applications.html"><i class="fa-solid fa-file-shield"></i> IP Applications</a></li>
                <li><a href="metrics.html"><i class="fa-solid fa-chart-line"></i> Metrics</a></li>
                <li><a href="news-events.html" class="active"><i class="fa-solid fa-newspaper"></i> News & Events</a></li>
                <li><a href="team.html"><i class="fa-solid fa-users"></i> Team</a></li>
                <li><a href="sdg.html"><i class="fa-solid fa-bullseye"></i> SDG</a></li>
            </ul>
        </nav>
    </aside>

    <main class="main-content">
        <header class="main-header">
            <a href="index.html" class="logout-btn"><i class="fa-solid fa-right-from-bracket"></i> Logout</a>
        </header>

        <section class="page-content">
            <div class="page-header">
                <div>
                    <h1>News & Events</h1>
                    <p class="subtitle">Manage announcements, news articles, and upcoming events</p>
                </div>
                <button class="btn btn-primary" id="add-news-event-btn"><i class="fa-solid fa-plus"></i> Add News/Event</button>
            </div>

            <div class="filters-container">
                <div class="search-wrapper">
                    <i class="fa-solid fa-search"></i>
                    <input type="text" id="search-input" placeholder="Search news and events...">
                </div>
                <div class="type-filters" id="news-event-type-filters">
                    <button class="filter-btn active" data-filter="all">All</button>
                    <button class="filter-btn" data-filter="news">News</button>
                    <button class="filter-btn" data-filter="event">Events</button>
                </div>
            </div>

            <div class="sort-container">
                <label for="sort-news">Sort by:</label>
                <select id="sort-news" class="sort-dropdown">
                    <option value="recent">Recent</option>
                    <option value="oldest">Oldest</option>
                    <option value="a-z">Title (A-Z)</option>
                    <option value="z-a">Title (Z-A)</option>
                </select>
            </div>
            
            <div class="news-event-list" id="news-event-list">
                </div>
        </section>
    </main>
    
    <div id="news-event-modal-overlay" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="news-event-modal-title">Add News/Event</h2>
                <button class="close-modal-btn" id="close-news-event-modal-btn">&times;</button>
            </div>
            <p id="news-event-modal-subtitle">Create a new news article or event</p>
            
            <form id="news-event-form" class="news-event-form">
                <div class="form-grid">
                    <div class="form-group">
                        <label for="news-event-title">Title *</label>
                        <input type="text" id="news-event-title" name="title" placeholder="Enter title" required>
                    </div>
                    <div class="form-group">
                        <label for="news-event-type">Type *</label>
                        <select id="news-event-type" name="type" required>
                            <option value="news">News</option>
                            <option value="event">Event</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="news-event-status">Status *</label>
                        <select id="news-event-status" name="status" required>
                            <option value="draft">Draft</option>
                            <option value="published">Published</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="news-event-date">Date *</label>
                        <input type="date" id="news-event-date" name="date" required>
                    </div>
                    <div class="form-group full-width">
                        <label for="news-event-tags">Tags (comma-separated)</label>
                        <input type="text" id="news-event-tags" name="tags" placeholder="Innovation Week, Event, Workshop">
                    </div>
                    
                    <!-- UPDATED SDG Multi-Select for Admin Modal -->
                    <div class="form-group full-width">
                        <label for="sdg-dropdown-btn">Sustainable Development Goals (SDG)</label>
                        <div class="multi-select-dropdown" id="sdg-multi-select">
                            <div class="dropdown-button" id="sdg-dropdown-btn" tabindex="0">
                                <span class="dropdown-button-text">Select SDGs (Multiple allowed)...</span>
                                <div class="selected-pills" id="sdg-selected-pills"></div>
                                <i class="fa-solid fa-chevron-down"></i>
                            </div>
                            <div class="checkbox-list" id="sdg-checkbox-list">
                                <div class="checkbox-list-item"><input type="checkbox" id="sdg1" name="sdg-option" value="SDG 1"><label for="sdg1">SDG 1: No Poverty</label></div>
                                <div class="checkbox-list-item"><input type="checkbox" id="sdg2" name="sdg-option" value="SDG 2"><label for="sdg2">SDG 2: Zero Hunger</label></div>
                                <div class="checkbox-list-item"><input type="checkbox" id="sdg3" name="sdg-option" value="SDG 3"><label for="sdg3">SDG 3: Good Health and Well-being</label></div>
                                <div class="checkbox-list-item"><input type="checkbox" id="sdg4" name="sdg-option" value="SDG 4"><label for="sdg4">SDG 4: Quality Education</label></div>
                                <div class="checkbox-list-item"><input type="checkbox" id="sdg5" name="sdg-option" value="SDG 5"><label for="sdg5">SDG 5: Gender Equality</label></div>
                                <div class="checkbox-list-item"><input type="checkbox" id="sdg6" name="sdg-option" value="SDG 6"><label for="sdg6">SDG 6: Clean Water and Sanitation</label></div>
                                <div class="checkbox-list-item"><input type="checkbox" id="sdg7" name="sdg-option" value="SDG 7"><label for="sdg7">SDG 7: Affordable and Clean Energy</label></div>
                                <div class="checkbox-list-item"><input type="checkbox" id="sdg8" name="sdg-option" value="SDG 8"><label for="sdg8">SDG 8: Decent Work and Economic Growth</label></div>
                                <div class="checkbox-list-item"><input type="checkbox" id="sdg9" name="sdg-option" value="SDG 9"><label for="sdg9">SDG 9: Industry, Innovation and Infrastructure</label></div>
                                <div class="checkbox-list-item"><input type="checkbox" id="sdg10" name="sdg-option" value="SDG 10"><label for="sdg10">SDG 10: Reduced Inequalities</label></div>
                                <div class="checkbox-list-item"><input type="checkbox" id="sdg11" name="sdg-option" value="SDG 11"><label for="sdg11">SDG 11: Sustainable Cities and Communities</label></div>
                                <div class="checkbox-list-item"><input type="checkbox" id="sdg12" name="sdg-option" value="SDG 12"><label for="sdg12">SDG 12: Responsible Consumption and Production</label></div>
                                <div class="checkbox-list-item"><input type="checkbox" id="sdg13" name="sdg-option" value="SDG 13"><label for="sdg13">SDG 13: Climate Action</label></div>
                                <div class="checkbox-list-item"><input type="checkbox" id="sdg14" name="sdg-option" value="SDG 14"><label for="sdg14">SDG 14: Life Below Water</label></div>
                                <div class="checkbox-list-item"><input type="checkbox" id="sdg15" name="sdg-option" value="SDG 15"><label for="sdg15">SDG 15: Life on Land</label></div>
                                <div class="checkbox-list-item"><input type="checkbox" id="sdg16" name="sdg-option" value="SDG 16"><label for="sdg16">SDG 16: Peace, Justice and Strong Institutions</label></div>
                                <div class="checkbox-list-item"><input type="checkbox" id="sdg17" name="sdg-option" value="SDG 17"><label for="sdg17">SDG 17: Partnerships for the Goals</label></div>
                            </div>
                        </div>
                        <!-- Validation input hidden -->
                        <input type="text" id="sdg-validation" style="display: none; height: 0; padding: 0; border: none;">
                    </div>

                    <div class="form-group full-width">
                        <label for="news-event-content">Content *</label>
                        <textarea id="news-event-content" name="content" placeholder="Enter full description or announcement details" required></textarea>
                    </div>
                </div>

                <div class="modal-actions">
                    <button type="button" class="btn btn-secondary" id="cancel-news-event-btn">Cancel</button>
                    <button type="submit" class="btn btn-primary" id="submit-news-event-btn">Create</button>
                </div>
            </form>
        </div>
    </div>
    
    <script src="js/news-events.js"></script>
</body>
</html>
