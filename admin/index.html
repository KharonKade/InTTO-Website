<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UC InTTO Admin Login</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body>

    <div class="login-card">
        <img src="./Logos/InTTO Logo White 3.png" alt="UC InTTO Logo" class="logo">
        
        <h1>UC InTTO Admin</h1>
        <p class="subtitle">Sign in to manage startups, news, and content</p>

        <form action="dashboard.html">
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" placeholder="admin@uc.edu.ph" required>
            </div>
            
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="••••••••••" required>
            </div>
            
            <button type="submit">Sign in</button>
        </form>

        <p class="demo-mode">Demo mode</p>
    </div>

</body>
</html>
