<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Signup - Debug</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 50px auto;
            padding: 20px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        input {
            width: 100%;
            padding: 8px;
            box-sizing: border-box;
        }
        button {
            background: #4285F4;
            color: white;
            padding: 10px 20px;
            border: none;
            cursor: pointer;
            font-size: 16px;
        }
        button:hover {
            background: #357ae8;
        }
        #debug-log {
            background: #f0f0f0;
            padding: 10px;
            margin-top: 20px;
            max-height: 400px;
            overflow-y: auto;
            font-family: monospace;
            font-size: 12px;
        }
        .log-entry {
            margin: 5px 0;
            padding: 5px;
            border-left: 3px solid #ccc;
        }
        .log-success { border-color: #4CAF50; color: #2e7d32; }
        .log-error { border-color: #f44336; color: #c62828; }
        .log-info { border-color: #2196F3; color: #1565c0; }
    </style>
</head>
<body>
    <h1>🧪 Test Signup - Debug Mode</h1>
    
    <form id="signup-form">
        <div class="form-group">
            <label for="signup-first-name-input">First Name *</label>
            <input type="text" id="signup-first-name-input" value="Test" required>
        </div>
        
        <div class="form-group">
            <label for="signup-last-name-input">Last Name *</label>
            <input type="text" id="signup-last-name-input" value="User" required>
        </div>
        
        <div class="form-group">
            <label for="signup-email-input">Email *</label>
            <input type="email" id="signup-email-input" value="test@uc-bcf.edu.ph" required>
        </div>
        
        <div class="form-group">
            <label for="signup-affiliation-input">Affiliation *</label>
            <input type="text" id="signup-affiliation-input" value="College of Computer Studies" required>
        </div>
        
        <div class="form-group">
            <label for="signup-password-input">Password *</label>
            <input type="password" id="signup-password-input" value="password123" required>
        </div>
        
        <div class="form-group">
            <label for="signup-password2-input">Confirm Password *</label>
            <input type="password" id="signup-password2-input" value="password123" required>
        </div>
        
        <button type="submit">Test Signup</button>
    </form>
    
    <div id="debug-log">
        <strong>Debug Log:</strong><br>
    </div>

    <script type="module">
        const debugLog = document.getElementById('debug-log');
        
        function log(message, type = 'info') {
            const entry = document.createElement('div');
            entry.className = `log-entry log-${type}`;
            entry.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
            debugLog.appendChild(entry);
            debugLog.scrollTop = debugLog.scrollHeight;
        }
        
        // Override console methods to capture logs
        const originalLog = console.log;
        const originalError = console.error;
        
        console.log = function(...args) {
            log(args.join(' '), 'info');
            originalLog.apply(console, args);
        };
        
        console.error = function(...args) {
            log(args.join(' '), 'error');
            originalError.apply(console, args);
        };
        
        log('Starting test page...', 'info');
        
        // Import the authentication module
        try {
            log('Importing authuC.js module...', 'info');
            await import('./js/authuC.js');
            log('✅ Module loaded successfully!', 'success');
        } catch (error) {
            log('❌ Error loading module: ' + error.message, 'error');
            console.error('Module loading error:', error);
        }
    </script>
</body>
</html>
